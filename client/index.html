<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A voxel world simulated and rendered by PL/SQL inside Oracle. The browser only draws the frames.">
  <meta name="theme-color" content="#000000">
  <title>PL/Craft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%235f9f35' d='M8 0l8 4-8 4-8-4z'/%3E%3Cpath fill='%234c7f2a' d='M0 4l8 4v8l-8-4z'/%3E%3Cpath fill='%233e6722' d='M16 4l-8 4v8l8-4z'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main id="stage">
    <canvas id="view" width="640" height="360" aria-label="Game view"></canvas>
    <pre id="hud"></pre>
    <p id="held-name" aria-live="polite"></p>
    <ol id="hotbar" aria-label="Blocks"></ol>
    <section id="term" aria-label="Session">
      <div id="log" role="log"></div>
      <div id="menu" hidden>
        <p></p>
        <p><span class="ps">SQL&gt;</span> select key, action from controls;</p>
        <p></p>
        <pre id="controls"></pre>
        <p></p>
        <p id="row-count"></p>
        <p></p>
        <p><span class="ps">SQL&gt;</span> <button id="play" type="button">Click to play</button></p>
      </div>
    </section>
  </main>
</body>
</html>
